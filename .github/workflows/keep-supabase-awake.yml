# Pings the Supabase database every 3 days so the free plan never pauses it (it pauses after 7 idle days).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the REST API
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        # RLS returns no rows to an anonymous caller, but the query still reaches Postgres.
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          echo "Supabase answered HTTP $status"
          test "$status" = "200"
